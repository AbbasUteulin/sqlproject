<!doctype html>
<html>
<head><meta charset="utf-8"><title>CSCI 341 - Conference Manager</title></head>
<body>
  <h1>Conference &amp; Paper Review Manager</h1>
  <nav>
    <a href="/">Home</a> |
    <a href="/users">Users</a> |
    <a href="/papers">Papers</a> |
    <a href="/reviews">Reviews</a> |
    <a href="/sessions">Sessions</a>
  </nav>
  <hr>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="flash {{ cat }}"><strong>{{ cat }}:</strong> {{ msg }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</body>
</html>
